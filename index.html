<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha NextGen Eclipse — Repricing UOM &amp; Productivity V23.0.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
:root{
  --bg:#fbf6ef;--surf:#ffffff;--surf2:#fdf3e6;--bd:#eedcc6;--bd2:#e3c9a8;--tx:#24160c;--mu:#6a4c36;
  --ac:#c2410c;--ac2:#9d174d;--amber:#f59e0b;--soft:#ffedd5;
  --esp1:#1d110a;--esp2:#2e1a0e;--esp3:#4a230c;
  --good-b:#dcfce7;--good-f:#14532d;--warn-b:#ffedd5;--warn-f:#9a3412;--bad-b:#fce7f3;--bad-f:#9d174d;
  --press:#86efac;--glow:rgba(74,222,128,.55);
  --font:Arial,Helvetica,sans-serif;--digi:Arial,Helvetica,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:13px}
body{background:radial-gradient(1200px 500px at 85% -120px,rgba(245,158,11,.16),transparent 60%),var(--bg)}
body.nosel *:not(input):not(textarea){user-select:none}
button,input,select,textarea{font-family:inherit;font-size:13.5px;color:var(--tx)}
.hidden{display:none!important}
a{color:var(--ac)}

/* ===== digital 3D buttons (press = sinks + green glow) ===== */
.b3{--top:#fff;--side:#e2c39d;--txc:var(--tx);position:relative;display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:8px 14px;min-height:38px;border-radius:12px;border:1px solid var(--side);cursor:pointer;color:var(--txc);font-weight:700;white-space:nowrap;
  background:linear-gradient(180deg,#fff 0%,#fff 50%,#fbf1e4 100%);
  box-shadow:0 4px 0 var(--side),0 8px 14px rgba(120,53,15,.14),inset 0 1px 0 #fff;transition:transform .07s,box-shadow .07s}
.b3:hover{filter:brightness(1.03)}
.b3:active,.b3.on{transform:translateY(3px);box-shadow:0 1px 0 var(--side),0 3px 0 var(--press),0 6px 14px var(--glow),inset 0 2px 5px rgba(0,0,0,.16)}
.b3:disabled{opacity:.42;cursor:not-allowed;transform:none;box-shadow:0 2px 0 var(--side)}
.b3.pri{--side:#7c2706;--txc:#fff;border-color:#9a3412;background:linear-gradient(180deg,#fb8a3c 0%,#ea580c 45%,#c2410c 100%)}
.b3.mag{--side:#5f0f33;--txc:#fff;border-color:#831843;background:linear-gradient(180deg,#e0479a,#9d174d)}
.b3.dan{--side:#eaa4c6;--txc:#9d174d;background:linear-gradient(180deg,#fff5fa,#fce7f3)}
.b3.dark{--side:#000;--txc:#fde68a;border-color:#5b3418;background:linear-gradient(180deg,#4a2a14,#2e1a0e)}
.b3.sm{padding:5px 10px;min-height:31px;font-size:12.5px;border-radius:10px;box-shadow:0 3px 0 var(--side),0 5px 9px rgba(120,53,15,.12),inset 0 1px 0 #fff}
.b3.sm:active,.b3.sm.on{transform:translateY(2px);box-shadow:0 1px 0 var(--side),0 2px 0 var(--press),0 4px 10px var(--glow)}
.b3.ico{padding:0;width:38px;min-width:38px}.b3.sm.ico{width:31px;min-width:31px}
.tg{width:46px;height:25px;border-radius:999px;border:1px solid #e2c39d;background:#f3e3cf;position:relative;cursor:pointer;flex:0 0 auto;box-shadow:inset 0 2px 4px rgba(0,0,0,.14)}
.tg::after{content:"";position:absolute;top:2px;left:2px;width:19px;height:19px;border-radius:50%;background:linear-gradient(180deg,#fff,#f1e4d4);box-shadow:0 2px 0 #d6b48f,0 3px 6px rgba(0,0,0,.18);transition:left .14s}
.tg[aria-pressed="true"]{background:#bbf7d0;border-color:#4ade80;box-shadow:inset 0 2px 4px rgba(0,0,0,.1),0 0 9px var(--glow)}
.tg[aria-pressed="true"]::after{left:23px;box-shadow:0 1px 0 #16a34a}
.tg:disabled{opacity:.6;cursor:not-allowed}

/* ===== header ===== */
.hdr{margin:0 14px;padding:16px 22px 34px;border-radius:0 0 26px 26px;color:#fff;position:relative;overflow:hidden;
  background:linear-gradient(120deg,var(--esp1) 0%,var(--esp2) 45%,var(--esp3) 100%);box-shadow:0 14px 30px rgba(46,26,14,.28)}
.hdr::before{content:"";position:absolute;right:-120px;top:-260px;width:620px;height:520px;border-radius:50%;
  background:radial-gradient(circle at 50% 70%,rgba(251,146,60,.55),rgba(234,88,12,.18) 45%,transparent 68%);pointer-events:none}
.hdr::after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;background:linear-gradient(90deg,transparent,#f59e0b,#ea580c,#db2777,transparent)}
.hrow{position:relative;display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:14px}
.brand .t1{font-weight:800;font-size:21px;letter-spacing:.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.brand .t1 .g{background:linear-gradient(90deg,#fff,#fde7c7);-webkit-background-clip:text;background-clip:text;color:transparent}
.ver{font-family:var(--digi);font-size:10.5px;font-weight:700;padding:3px 9px;border-radius:7px;color:#bbf7d0;background:rgba(20,83,45,.55);border:1px solid rgba(134,239,172,.45);letter-spacing:.08em;box-shadow:0 0 10px rgba(74,222,128,.25)}
.brand .t2{margin-top:3px;font-size:11px;font-weight:800;letter-spacing:.24em;text-transform:uppercase;display:flex;align-items:center;gap:10px}
.brand .t2 span{background:linear-gradient(90deg,#fdba74,#fbbf24 50%,#f9a8d4);-webkit-background-clip:text;background-clip:text;color:transparent}
.brand .t2::after{content:"";width:46px;height:2px;border-radius:2px;background:linear-gradient(90deg,#fbbf24,transparent)}
.glass{display:flex;align-items:center;gap:8px;padding:6px 10px;border-radius:14px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.16);backdrop-filter:blur(8px)}
.glass input[type=date]{background:transparent;border:0;color:#fff;font-weight:700;color-scheme:dark;font-size:12.5px;width:122px}
.glass .lb{font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;color:#fcd9b6;font-weight:800}
.qk{border:1px solid rgba(255,255,255,.22);background:rgba(255,255,255,.06);color:#fde7c7;border-radius:8px;padding:4px 8px;font-size:11.5px;font-weight:700;cursor:pointer;box-shadow:0 2px 0 rgba(0,0,0,.4)}
.qk:active,.qk.on{transform:translateY(2px);box-shadow:0 0 0 rgba(0,0,0,.4),0 0 10px var(--glow);border-color:#86efac;color:#bbf7d0}
.srv{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:rgba(22,101,52,.35);border:1px solid rgba(134,239,172,.4);color:#bbf7d0}
.srv i{width:8px;height:8px;border-radius:50%;background:#4ade80;box-shadow:0 0 8px #4ade80}
.who{display:flex;align-items:center;gap:9px}
.ava{width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-weight:800;color:#2e1a0e;background:linear-gradient(180deg,#fde68a,#f59e0b);box-shadow:0 3px 0 #92400e}
.who b{display:block;font-size:13px}.who small{color:#f5d0b0;font-size:11px}
.hdr .b3{--side:#000;--txc:#fde7c7;border-color:#5b3418;background:linear-gradient(180deg,#4a2a14,#2a170b)}
.hdr .b3 .bdg{position:absolute;top:-6px;right:-6px;background:#db2777;color:#fff;font-size:10px;border-radius:999px;padding:1px 6px}
.navwrap{display:flex;justify-content:center;margin-top:-24px;position:relative;z-index:2;padding:0 14px}
.nav{display:flex;flex-wrap:wrap;gap:8px;padding:9px 10px 12px;background:#fff;border:1px solid var(--bd);border-radius:18px;box-shadow:0 12px 26px rgba(120,53,15,.12)}
.nav .b3{min-width:132px}
main{padding:16px 16px 8px;width:100%}
footer{padding:12px;text-align:center;font-size:11.5px;color:var(--mu)}

/* ===== blocks ===== */
.ph{display:flex;flex-wrap:wrap;gap:12px;align-items:flex-end;justify-content:space-between;margin:6px 0 14px}
.ph h1{margin:0;font-size:18px;font-weight:800;display:flex;align-items:center;gap:10px}
.ph h1::before{content:"";width:6px;height:22px;border-radius:4px;background:linear-gradient(180deg,#f59e0b,#c2410c)}
.ph p{margin:3px 0 0 16px;color:var(--mu);font-size:12.5px}
.row{display:flex;flex-wrap:wrap;gap:14px}.grow{flex:999 1 640px;min-width:0}.side{flex:0 1 300px;min-width:260px}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:18px;box-shadow:0 6px 18px rgba(120,53,15,.07);padding:14px 16px;min-width:0}
.cap{font-size:10.5px;font-weight:800;letter-spacing:.16em;text-transform:uppercase;color:var(--ac);display:flex;align-items:center;gap:8px;margin-bottom:8px}
.cap::before{content:"";width:14px;height:3px;border-radius:3px;background:var(--ac)}
.sub{font-size:12px;color:var(--mu)}
.tools{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.sp{flex:1}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 0;border-top:1px dashed var(--bd)}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 9px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;background:var(--surf2);color:var(--mu);border:1px solid var(--bd)}
.chip.good{background:var(--good-b);color:var(--good-f);border-color:#bbf7d0}.chip.warn{background:var(--warn-b);color:var(--warn-f);border-color:#fed7aa}.chip.bad{background:var(--bad-b);color:var(--bad-f);border-color:#fbcfe8}.chip.ac{background:var(--soft);color:var(--ac);border-color:#fed7aa}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:12px;margin-bottom:14px}
.kpi{position:relative;overflow:hidden}
.kpi .v{font-size:19px;font-weight:700;margin-top:2px}
.kpi .dl{font-size:11px;font-weight:700;margin-top:4px}.dl.up{color:#15803d}.dl.dn{color:#be185d}
.lg{display:flex;align-items:center;gap:7px;font-size:12px;padding:3px 0}.lg i{width:10px;height:10px;border-radius:3px;flex:0 0 auto}.lg b{margin-left:auto;padding-left:10px}
.dgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:14px}
.plist{display:flex;flex-direction:column;gap:4px;max-height:70vh;overflow:auto}.plist button{all:unset;cursor:pointer;padding:7px 10px;border-radius:9px;font-size:12.5px;font-weight:600;border:1px solid transparent}.plist button:hover{background:var(--surf2)}.plist button.on{background:#dcfce7;border-color:#86efac;color:#14532d;box-shadow:0 2px 0 #86efac}
.kpi .s{font-size:11.5px;color:var(--mu);margin-top:2px}
.kpi .ic{position:absolute;right:12px;top:12px;width:34px;height:34px;border-radius:10px;background:var(--soft);color:var(--ac);display:flex;align-items:center;justify-content:center}
.seg{display:inline-flex;gap:6px;padding:5px;background:var(--surf2);border:1px solid var(--bd);border-radius:14px}
.fld{display:flex;flex-direction:column;gap:5px}.fld label{font-size:12px;font-weight:700}
input.in,select.in{border:1px solid var(--bd2);border-radius:10px;padding:7px 10px;background:#fffaf4;min-height:36px;box-shadow:inset 0 2px 3px rgba(120,53,15,.06);width:100%}
input.in:focus,select.in:focus{outline:2px solid rgba(234,88,12,.35);border-color:var(--ac)}
.msg{padding:9px 12px;border-radius:12px;font-size:12.5px;font-weight:700;display:flex;gap:8px;align-items:center}
.msg.bad{background:var(--bad-b);color:var(--bad-f)}.msg.good{background:var(--good-b);color:var(--good-f)}.msg.warn{background:var(--warn-b);color:var(--warn-f)}
.banner{display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:9px 12px;border-radius:12px;margin-bottom:10px;font-weight:700;font-size:12.5px}
.banner.lock{background:linear-gradient(90deg,#2e1a0e,#4a230c);color:#fde7c7}
.banner.tamper{background:var(--bad-b);color:var(--bad-f);border:1px solid #f9a8d4}

/* ===== excel grid ===== */
.xl{overflow:auto;max-height:62vh;border:1px solid var(--bd2);border-radius:14px;background:#fff;outline:none;position:relative}
.xl:focus{box-shadow:0 0 0 3px rgba(234,88,12,.18)}
table.g{border-collapse:separate;border-spacing:0;min-width:100%}
table.g{table-layout:fixed}table.g td,table.g th{border-right:1px solid #f0e2cf;border-bottom:1px solid #f0e2cf;padding:0 8px;height:27px;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rz{position:absolute;right:-3px;top:0;bottom:0;width:8px;cursor:col-resize;z-index:5}.rz:hover,.rz.on{background:linear-gradient(90deg,transparent 3px,#ea580c 3px,#ea580c 5px,transparent 5px)}
table.g th.hd{position:sticky}
.nm{cursor:pointer;text-decoration:underline dotted #c2410c}
.pv{position:fixed;inset:0;z-index:70;background:var(--bg);overflow:auto}
.wk{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-bottom:14px}
.wkc{cursor:pointer}.wkc:hover{border-color:#fdba74}
.lbtn{background:none;border:0;padding:0;font:inherit;font-weight:700;color:#7c2d12;cursor:pointer;text-align:left;text-decoration:underline dotted}
table.g thead th{position:sticky;z-index:3}
table.g th.lt{top:0;height:20px;background:#f7eadb;color:#8a6a52;font-size:10.5px;font-weight:600;text-align:center}
table.g th.hd{top:20px;background:linear-gradient(180deg,#fff1e0,#ffe6c9);color:#6b2a0b;font-weight:700;text-align:center;height:32px;box-shadow:inset 0 -2px 0 #f2c79a}
table.g th.hd.cmp{background:linear-gradient(180deg,#f6eee4,#ecdfcf);color:#6a4c36}
table.g th.hd .hn{display:inline-block;max-width:240px;overflow:hidden;text-overflow:ellipsis;vertical-align:middle}
.fb{margin-left:6px;border:1px solid #e9c9a2;background:#fff;border-radius:6px;width:20px;height:20px;line-height:16px;font-size:10px;cursor:pointer;color:#9a3412;vertical-align:middle;box-shadow:0 2px 0 #e2c39d;padding:0}
.fb.on{background:#bbf7d0;border-color:#4ade80;color:#14532d;box-shadow:0 0 6px var(--glow)}
table.g td.rn,table.g th.rn{position:sticky;left:0;z-index:2;background:#f7eadb;color:#8a6a52;font-size:10.5px;text-align:center;width:42px;min-width:42px;padding:0}
table.g thead th.rn{z-index:4}
table.g td{cursor:cell;background:#fff}
table.g td.cmp{background:#fbf5ee;color:#5a3f2c}
table.g td{text-align:center}table.g td.lft{text-align:left}table.g td.n{font-variant-numeric:tabular-nums}
table.g td.good{background:#e7f9ed;color:#14532d;font-weight:600}table.g td.warn{background:#fff0e0;color:#9a3412;font-weight:600}table.g td.bad{background:#fdebf4;color:#9d174d;font-weight:600}
table.g td.sel{background-image:linear-gradient(rgba(234,88,12,.13),rgba(234,88,12,.13))}
table.g td.cur{box-shadow:inset 0 0 0 2px #c2410c}
table.g td.ed{padding:0;box-shadow:inset 0 0 0 2px #16a34a}
table.g td.ed input{width:100%;height:28px;border:0;outline:0;padding:0 9px;font-size:12.5px;background:#f0fdf4;min-width:140px}
.xl.ro td{cursor:default}
.sbar{display:flex;gap:16px;flex-wrap:wrap;font-size:11.5px;color:var(--mu);padding:7px 4px 0;font-variant-numeric:tabular-nums}
.sbar b{color:var(--tx)}
.fpop{position:absolute;z-index:80;width:250px;background:#fff;border:1px solid var(--bd2);border-radius:14px;box-shadow:0 18px 40px rgba(46,26,14,.25);padding:10px}
.fpop .lst{max-height:220px;overflow:auto;border:1px solid var(--bd);border-radius:10px;padding:4px;margin:8px 0}
.fpop label{display:flex;gap:7px;align-items:center;padding:4px 6px;font-size:12.5px;border-radius:6px;cursor:pointer}
.fpop label:hover{background:var(--surf2)}
.fpop input[type=checkbox]{accent-color:#16a34a}

/* ===== tables (simple) ===== */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:12px}
table.t{width:100%;border-collapse:collapse}
table.t th{background:#fff1e0;color:#6b2a0b;font-size:11.5px;font-weight:800;text-align:left;padding:8px 10px;white-space:nowrap}
table.t td{padding:7px 10px;border-top:1px solid var(--bd);font-size:12.5px;vertical-align:middle}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#cbb59c;margin-right:6px}.dot.on{background:#22c55e;box-shadow:0 0 6px #22c55e}

/* ===== day strip / bars ===== */
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(54px,1fr));gap:6px}
.dy{border-radius:10px;padding:6px 4px;text-align:center;font-size:11px;font-weight:700;border:1px solid var(--bd);background:#fff;cursor:pointer;box-shadow:0 3px 0 #ecd2b2}
.dy b{display:block;font-family:var(--digi);font-size:14px}
.dy.good{background:var(--good-b);color:var(--good-f);border-color:#bbf7d0}.dy.bad{background:var(--bad-b);color:var(--bad-f);border-color:#fbcfe8}.dy.we{opacity:.55;box-shadow:none}
.dy:active{transform:translateY(2px);box-shadow:0 1px 0 #ecd2b2,0 0 10px var(--glow)}
.bar{display:flex;align-items:center;gap:10px;padding:4px 0;font-size:12px}
.bar .n{width:140px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar .tr{flex:1;height:11px;border-radius:8px;background:#f5e8d8;box-shadow:inset 0 1px 2px rgba(0,0,0,.1);position:relative;overflow:hidden}
.bar .tr i{position:absolute;left:0;top:0;bottom:0;border-radius:8px}
.bar .v{width:64px;text-align:right;font-weight:800;font-variant-numeric:tabular-nums}

/* ===== login ===== */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:26px}
.lbox{width:100%;max-width:960px;display:flex;flex-wrap:wrap;background:#fff;border-radius:30px;box-shadow:0 30px 70px rgba(46,26,14,.22);overflow:hidden}
.lleft{flex:1 1 360px;padding:40px;color:#fff;position:relative;overflow:hidden;background:linear-gradient(140deg,var(--esp1),var(--esp2) 50%,var(--esp3));display:flex;flex-direction:column;justify-content:space-between;gap:26px;min-height:440px}
.lleft::before{content:"";position:absolute;left:50%;bottom:-210px;transform:translateX(-50%);width:520px;height:420px;border-radius:50%;background:radial-gradient(circle at 50% 30%,rgba(251,146,60,.85),rgba(234,88,12,.35) 45%,transparent 70%)}
.lleft>*{position:relative}
.lright{flex:1 1 380px;padding:34px 38px;display:flex;flex-direction:column;gap:12px}
.lright h2{margin:0;font-size:24px;font-weight:800}
.inp{display:flex;align-items:center;gap:10px;background:#fffaf4;border:1px solid var(--bd2);border-radius:13px;padding:0 12px;min-height:44px;box-shadow:inset 0 2px 4px rgba(120,53,15,.06)}
.inp input{flex:1;min-width:0;border:0;outline:0;background:transparent;height:42px}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(234,88,12,.15)}

/* ===== modal / toast ===== */
.ov{position:fixed;inset:0;background:rgba(29,17,10,.5);display:flex;align-items:center;justify-content:center;padding:18px;z-index:90}
.modal{background:#fff;border-radius:22px;max-width:760px;width:100%;max-height:92vh;overflow:auto;padding:20px;box-shadow:0 30px 80px rgba(0,0,0,.35)}
.toast{position:fixed;right:18px;bottom:18px;z-index:99;display:flex;flex-direction:column;gap:8px}
.toast div{background:linear-gradient(90deg,#2e1a0e,#4a230c);color:#fde7c7;padding:11px 15px;border-radius:13px;font-weight:700;box-shadow:0 10px 24px rgba(0,0,0,.3);max-width:380px;border-left:3px solid #4ade80}
.perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:7px}
.perm label{display:flex;gap:8px;align-items:center;padding:7px 9px;border:1px solid var(--bd);border-radius:10px;font-size:12.5px;font-weight:600}
.perm input{width:17px;height:17px;accent-color:#16a34a}
.mailbox{background:#fff;border:1px solid var(--bd);border-radius:12px;padding:16px;font-family:Calibri,Arial,sans-serif;color:#000;overflow-x:auto}
@media (max-width:760px){main{padding:14px}.hdr{margin:0;border-radius:0 0 20px 20px;padding:14px 14px 34px}.nav .b3{min-width:0}.lleft,.lright{padding:24px}}
table.g th.hd.cmp{white-space:normal;line-height:1.1;height:38px;font-size:11px;padding:0 3px}
table.g th.hd.cmp .hn{white-space:normal;max-width:62px;text-align:center;display:inline-block}
table.g th.hd.cmp .fb{display:none}
table.g td.cmp{padding:0 4px;text-align:center}
.xl.big table.g td,.xl.big table.g th.hd{font-size:15.5px;height:36px}.xl.big table.g th.hd{height:40px}
.dgrid .cap{font-size:13.5px}.dgrid .lg{font-size:15px;font-weight:600}.dgrid .lg b{font-size:15px}

async function key(){if(KEY)return KEY;const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(_k.join('|')),'PBKDF2',false,['deriveKey']);
  KEY=await crypto.subtle.deriveKey({name:'PBKDF2',salt:new TextEncoder().encode('AlphaNextGenEclipse.Repricing'),iterations:60000,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt']);return KEY;}
function b64(u){let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s);}
function ub64(s){const b=atob(s),u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;}
async function enc(o){const iv=crypto.getRandomValues(new Uint8Array(12));const ct=new Uint8Array(await crypto.subtle.encrypt({name:'AES-GCM',iv},await key(),new TextEncoder().encode(JSON.stringify(o))));const a=new Uint8Array(12+ct.length);a.set(iv);a.set(ct,12);return 'RPX1:'+b64(a);}
async function dec(t){if(!t.startsWith('RPX1:'))throw new Error('t');const a=ub64(t.slice(5).trim());return JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},await key(),a.slice(12))));}

function idb(){return new Promise((r,j)=>{const q=indexedDB.open('rp23b',1);q.onupgradeneeded=()=>q.result.createObjectStore('kv');q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error);});}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();});}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}
async function dh(p,c=true){let h=dir;for(const x of p.split('/').filter(Boolean))h=await h.getDirectoryHandle(x,{create:c});return h;}
async function rawR(p){try{const a=p.split('/'),f=a.pop();const h=await (await dh(a.join('/'),false)).getFileHandle(f);return await (await h.getFile()).text();}catch(e){return null;}}
async function rawW(p,t){const a=p.split('/'),f=a.pop();const h=await (await dh(a.join('/'),true)).getFileHandle(f,{create:true});const w=await h.createWritable();await w.write(t);await w.close();}
async function ls(p){try{const d=await dh(p,true),o=[];for await(const [n,h] of d.entries())if(h.kind==='file')o.push(n);return o.sort();}catch(e){return [];}}
async function rm(p){const a=p.split('/'),f=a.pop();try{await (await dh(a.join('/'),false)).removeEntry(f);}catch(e){}}

const tgt=()=>cfg.target;

const filled=a=>(a||[]).filter(r=>r&&r.some(x=>String(x??'').trim()));
async function savedDates(){return (await ls('Data')).filter(n=>/^\d{4}-\d{2}-\d{2}\.rpx$/.test(n)).map(n=>n.slice(0,10));}
async function getDay(d){if(cache[d]!==undefined)return cache[d];cache[d]=await rd(dataP(d),null);return cache[d];}
async function rangeData(from=range.from,to=range.to){const S=new Set(await savedDates());const out=[];for(let d=from;d<=to;d=addD(d,1)){let x=S.has(d)?await getDay(d):null;
  if(d===cur.date&&(cur.dirty||!x))x={date:d,rep:filled(cur.rep),uom:filled(cur.uom),live:true};if(x)out.push(x);}return out;}
async function backRows(v){const S=new Set(await savedDates()),out=[],seen=new Set();for(let d=v.from;d<=v.to;d=addD(d,1)){if(!S.has(d))continue;const y=await getDay(d);((y&&y.rep)||[]).forEach(r=>{if(!r||!String(r[1]||'').trim())return;const k=(anyDate(r[0])||d)+'|'+String(r[1]).trim().toLowerCase();if(!seen.has(k)){seen.add(k);out.push(JSON.parse(JSON.stringify(r)));}});}out.sort((a,b)=>String(anyDate(a[0])||'9').localeCompare(String(anyDate(b[0])||'9')));return out;}
async function loadWork(d){cur.date=d;const x=await getDay(d);cur.rep=x?JSON.parse(JSON.stringify(x.rep||[])):[];cur.uom=x?JSON.parse(JSON.stringify(x.uom||[])):[];
  cur.locked=!!(x&&x.locked);cur.unlocked=false;cur.dirty=false;cur.savedAt=x?x.savedAt:null;cur.savedBy=x?x.savedBy:null;}
function weekly(days){const W={};days.forEach(x=>filled(x.rep).forEach(r=>{const R=repRow(r,x.date);if(!R.name)return;const wk=monday(R.date),k=wk+'|'+R.name.toLowerCase();
  W[k]=W[k]||{wk,name:R.name,dates:new Set(),ach:0,mins:0};W[k].dates.add(R.date);W[k].ach+=R.ach;W[k].mins+=R.mins;}));
  return Object.values(W).sort((a,b)=>a.wk.localeCompare(b.wk)||a.name.localeCompare(b.name)).map(w=>({...w,days:w.dates.size,target:tgt()*w.dates.size,def:tgt()*w.dates.size-w.ach}));}

const toks=n=>String(n||'').toUpperCase().split(/[^A-Z0-9]+/).filter(Boolean);
function nameMatch(a,b){const x=toks(a),y=toks(b);if(!x.length||!y.length||x[0]!==y[0])return false;const [s,l]=x.length<=y.length?[x,y]:[y,x];return s.every(t=>l.includes(t));}
function team(days){days=RD(days);const P=[];const find=n=>P.find(p=>nameMatch(p.name,n));
  days.forEach(x=>{filled(x.rep).forEach(r=>{const R=repRow(r,x.date);if(!R.name)return;let p=find(R.name);if(!p){p={name:R.name,rep:[],uom:[]};P.push(p);}p.rep.push(R);});});

  return P.map(p=>{const proc=p.rep.reduce((a,r)=>a+r.ach,0),tg=p.rep.reduce((a,r)=>a+r.target,0),dm=p.rep.reduce((a,r)=>a+r.mins,0),avg=k=>{const v=p.uom.filter(u=>!isNaN(u[k]));return v.length?v.reduce((a,u)=>a+u[k],0)/v.length:NaN;};
    return {...p,days:new Set([...p.rep.map(r=>r.date),...p.uom.map(u=>u.date)]).size,proc,tg,def:tg-proc,ach:tg?proc/tg*100:NaN,dm,util:avg('util'),eff:avg('eff'),lc:avg('lc'),vol:p.uom.reduce((a,u)=>a+(u.vol||0),0)};});}

function reasonOf(t){t=String(t||'').replace(/\d+(\.\d+)?\s*(mins?|minutes?|m)\b/gi,'').replace(/ritm\d+/gi,'').replace(/[-–:]/g,' ').replace(/\s+/g,' ').trim().toLowerCase();

function donut(segs,center,sub,size=118){const tot=segs.reduce((a,s)=>a+s.v,0);const cx=size/2,cy=size/2,R=size/2-6,r=R-17;let a0=-Math.PI/2,g='';

function trendSVG(pts,h=230){if(!pts.some(p=>p.v||p.pv))return '<div class="sub" style="padding:30px 0;text-align:center">No repricing data in this range.</div>';

   <div class="tools" style="gap:14px;font-size:11.5px;color:var(--mu)"><span><i style="display:inline-block;width:10px;height:10px;background:#22c55e;border-radius:2px"></i> Target met</span><span><i style="display:inline-block;width:10px;height:10px;background:#ec4899;border-radius:2px"></i> Below target</span><span style="color:#c2410c">━ Target</span><span style="color:#7c3aed">┅ Previous period</span><span style="color:#db2777">× Missing day</span></div>`;}
function delta(cur,prev,upGood=true,unit='%',abs=false){if(isNaN(cur)||isNaN(prev)||(!abs&&!prev))return '<div class="dl" style="color:var(--mu)">— vs previous period</div>';

function sumUp(days){days=RD(days);const R=days.flatMap(x=>filled(x.rep).map(r=>repRow(r,x.date))).filter(r=>r.name),U=days.flatMap(x=>filled(x.uom).map(uomRow)).filter(r=>r.name);

function xlsXML(sheets){let o='<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#C2410C" ss:Pattern="Solid"/></Style><Style ss:ID="g"><Interior ss:Color="#92D050" ss:Pattern="Solid"/></Style><Style ss:ID="o"><Interior ss:Color="#FFA500" ss:Pattern="Solid"/></Style><Style ss:ID="p"><Interior ss:Color="#FF99CC" ss:Pattern="Solid"/></Style></Styles>';
  const used=new Set();for(const s of sheets){let n=String(s.name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31);while(used.has(n))n=n.slice(0,27)+'_'+used.size;used.add(n);o+=`<Worksheet ss:Name="${esc(n)}"><Table>`;
    s.rows.forEach((r,i)=>{o+='<Row>'+r.map((c,j)=>{const st=i===0?' ss:StyleID="h"':(s.st&&s.st[i]&&s.st[i][j]?` ss:StyleID="${s.st[i][j]}"`:'');const isN=typeof c==='number'&&isFinite(c);return `<Cell${st}><Data ss:Type="${isN?'Number':'String'}">${esc(c)}</Data></Cell>`;}).join('')+'</Row>';});o+='</Table></Worksheet>';}
  return o+'</Workbook>';}

  if(adTab==='alerts'){const L=Object.entries(secS.locked);
    body=`<div class="row"><div class="grow"><div class="tools" style="margin-bottom:8px"><div class="cap" style="margin:0">Alerts</div><span class="sp"></span>${B('Mark all read',{sm:1,i:'check',act:'aread'})}${B('Clear alerts',{sm:1,k:'dan',i:'trash',act:'aclr'})}</div><div id="ash"></div></div>
     <div class="side"><div class="card"><div class="cap">Locked IDs</div>${L.map(([k,v])=>`<div class="line"><span><b>${esc(k)}</b><div class="sub">${new Date(v.at).toLocaleString('en-GB')} · ${esc(v.pc||'')}</div></span>${B('Unlock',{sm:1,k:'pri',i:'unlock',act:'unl',arg:k})}</div>`).join('')||'<div class="sub">No locked IDs.</div>'}</div>
     <div style="height:12px"></div><div class="card"><div class="cap">Online sessions</div>${Object.values(sessions).map(s=>`<div class="line"><span><span class="dot on"></span><b>${esc(s.msid)}</b><div class="sub">${esc(s.pc)}</div></span>${s.msid.toLowerCase()===ADMIN_MSID?'<span class="chip ac">You</span>':B('Kick',{sm:1,k:'dan',i:'logout',act:'kick',arg:s.msid.toLowerCase()})}</div>`).join('')||'<div class="sub">No one online.</div>'}</div></div></div>`;}
  if(adTab==='settings'){const fl=(id,l,v,t='text')=>`<div class="fld"><label for="${id}">${l}</label><input class="in" type="${t}" id="${id}" value="${esc(v)}"></div>`;
    body=`<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(300px,1fr));gap:14px">
     <div class="card"><div class="cap">Report rules</div><div style="display:grid;gap:10px">${fl('s_t','Daily target (reprice)',cfg.target,'number')}${fl('s_ub','Utilization pink below %',cfg.th.utilBad,'number')}${fl('s_eb','Efficiency pink below %',cfg.th.effBad,'number')}${fl('s_ew','Efficiency orange above %',cfg.th.effWarn,'number')}</div></div>
     <div class="card"><div class="cap">Mail</div><div style="display:grid;gap:10px">${fl('s_to','Report To',cfg.mail.to)}${fl('s_cc','Report Cc',cfg.mail.cc)}${fl('s_sub','Subject ({date})',cfg.mail.subject)}${fl('s_ae','Admin alert email (lock / help mail)',cfg.mail.adminEmail)}${fl('s_wh','Auto-mail webhook URL (Power Automate / Teams — optional)',cfg.mail.webhook)}</div></div>
     <div class="card"><div class="cap">Validity & retention</div><div style="display:grid;gap:10px">${fl('s_ex','Tool valid till',cfg.expiry,'date')}${fl('s_kl','Keep logs (days)',cfg.keep.logs,'number')}${fl('s_kb','Keep backups (days)',cfg.keep.backups,'number')}</div></div></div>
     <div style="margin-top:14px">${B('Save settings',{k:'pri',i:'save',act:'ss'})}</div>`;}
  if(adTab==='security'){const S=[['onePC','One ID · one PC','MSID locked to the PC used at first sign-in'],['oneSession','One ID · one session','Same ID cannot run on two PCs at once'],['rememberPw','Allow users to remember password','Checkbox on sign-in screen'],['f12','Block F12 / DevTools keys',''],['ctrlU','Block Ctrl+U',''],['rightClick','Disable right-click',''],['ctrlPS','Block Ctrl+P / Ctrl+S',''],['copyBlock','Allow copy only inside grid / mail','']];
    body=`<div class="row"><div class="grow"><div class="card"><div class="cap">Security switches</div>${S.map(s=>`<div class="line"><span><b>${s[1]}</b>${s[2]?`<div class="sub">${s[2]}</div>`:''}</span><button type="button" class="tg" aria-pressed="${!!cfg.sec[s[0]]}" data-sec="${s[0]}" aria-label="${s[1]}"></button></div>`).join('')}
     <div class="line"><span><b>Failed password limit</b><div class="sub">ID locks + Admin alert after this many attempts</div></span><input class="in" type="number" id="s_mf" value="${cfg.sec.maxFails}" style="width:80px" aria-label="Max fails"></div>
     <div class="line"><span><b>Auto logout (min, 0 = off)</b></span><input class="in" type="number" id="s_al" value="${cfg.sec.autoLogout}" style="width:80px" aria-label="Auto logout"></div>
     <div style="margin-top:10px">${B('Save security',{k:'pri',i:'save',act:'sec'})}</div><div class="sub" style="margin-top:8px">Browser key blocking is a deterrent only; real protection = encrypted server files + folder permissions.</div></div></div>
     <div class="side"><div class="card"><div class="cap">Admin protection</div><div class="sub">Admin = PC …${ADMIN_PC_END.toUpperCase()} + MSID ${ADMIN_MSID} + master password. Password is cached only on your PC.</div>
     <div style="display:grid;gap:8px;margin-top:10px"><input class="in" type="password" id="s_op" placeholder="Current master password" aria-label="Current master password"><input class="in" type="password" id="s_np" placeholder="New master password" aria-label="New master password">${B('Change master password',{k:'mag',i:'lock',act:'mpc'})}</div></div></div></div>`;}
  if(adTab==='logs'){const files=(await ls('Logs')).reverse();const pick=window._lp||'all';let L=[];for(const f of (pick==='all'?files:[pick]))L=L.concat(await rd('Logs/'+f,[]));L=L.filter(l=>String(l.msid).toLowerCase()!==ADMIN_MSID);L.reverse();
    body=`<div class="tools" style="margin-bottom:10px"><select class="in" id="lp" style="width:auto" aria-label="Log day"><option value="all">All (${cfg.keep.logs} days)</option>${files.map(f=>`<option ${f===pick?'selected':''} value="${esc(f)}">${esc(f.replace('Log_','').replace('.rpx',''))}</option>`).join('')}</select>
     <span class="sp"></span>${pick!=='all'?B('Erase this day',{k:'dan',i:'trash',act:'le1'}):''}${B('Erase all logs',{k:'dan',i:'trash',act:'leall'})}</div><div id="lsh"></div>`;
    window._logs=L;}
  if(adTab==='backups'){const files=(await ls('Backups')).reverse();const det=[];for(const f of files){const b=await rd('Backups/'+f,{snaps:[]});(b.snaps||[]).forEach((s,i)=>det.push([f,i,s]));}det.sort((a,b)=>b[0].localeCompare(a[0])||b[1]-a[1]);
    const SD=(await savedDates()).reverse();
    body=`<div class="banner tamper" style="background:#fff7ed;color:#9a3412;border-color:#fed7aa">${ic('trash',15)} Delete saved data — Admin only (users cannot delete)
      <select class="in" id="ddel" style="width:auto" aria-label="Date to delete">${SD.map(d=>`<option value="${d}">${fmtD(d)}</option>`).join('')}</select>${B('Delete date',{sm:1,k:'dan',i:'trash',act:'ddel',dis:!SD.length})}</div>
     <div class="tools" style="margin-bottom:10px">${B('Backup now',{k:'pri',i:'save',act:'bn'})}<span class="sub">Settings + users (passwords stored as hash only — unreadable) + that day's data · ${cfg.keep.backups} days · encrypted</span></div>
     <div class="tw"><table class="t"><thead><tr><th>Day</th><th>Time</th><th>By</th><th>Reason</th><th style="text-align:right">Restore</th></tr></thead><tbody>${det.slice(0,150).map(([f,i,s])=>`<tr><td>${esc(f.match(/\d{4}-\d{2}-\d{2}/)[0])}</td><td>${esc(s.t)}</td><td>${esc(s.by)}</td><td>${esc(s.reason)}</td><td style="text-align:right">${B('Restore',{sm:1,i:'history',act:'br',arg:f+'|'+i})}</td></tr>`).join('')||'<tr><td colspan="5" class="sub">No backups yet.</td></tr>'}</tbody></table></div>`;}
  $('#main').innerHTML=tamperBanner()+head('Admin','Full control — access, security, alerts, logs, backups',`<span class="chip ac">${ic('shield',13)} ${ADMIN_MSID} · ${ADMIN_EMP}</span>`)+
   `<div class="seg" style="margin-bottom:12px;flex-wrap:wrap">${T.map(t=>B(t[1]+(t[0]==='alerts'&&unread?` (${unread})`:''),{i:t[2],act:'at',arg:t[0],on:adTab===t[0]})).join('')}</div><div class="card">${body}</div>`;
  on('[data-act=at]',a=>{adTab=a;render();});
  // users
  $$('[data-perm]').forEach(b=>b.onclick=async()=>{const [i,p]=b.dataset.perm.split('|'),u=users[+i];u.perms[p]=!u.perms[p];await saveUsers('access');await log('ACCESS',`${u.msid} ${p}=${u.perms[p]}`);render();});
  on('[data-act=uas]',i=>startAs(users[+i]));on('[data-act=ued]',i=>userModal(+i));on('[data-act=uadd]',()=>userModal(-1));on('[data-act=uimp]',importUsers);
  on('[data-act=uxl]',()=>{const h=['Name','MSID','Employee ID','Email','Team','PC Name','Role','Valid Till','Active','Password','Last login',...PERMS.map(p=>p[1])];
    dl('Repricing_Users.xls',xlsXML([{name:'Users',rows:[h,...users.map(u=>[u.name,u.msid,u.empId||'',u.email||'',u.team||'',u.msid.toLowerCase()===ADMIN_MSID?'…'+ADMIN_PC_END.toUpperCase():u.pc,u.role,u.validTill,u.active?'Yes':'No',u.pw?'Set (hidden)':'Not set',u.lastLogin?new Date(u.lastLogin).toLocaleString('en-GB'):'',...PERMS.map(p=>(u.role==='Admin'||u.perms[p[0]])?'Yes':'No')])]}]));log('USERS EXPORT','');});
  // alerts
  if(adTab==='alerts')new Sheet($('#ash'),{ro:true,left:[4],w:{4:420},headers:['Time','Type','MSID','PC','Message','Status'],data:secS.alerts.map(a=>[a.t,a.type,a.msid,a.pc,a.msg,a.read?'seen':'NEW']),cls:(r,c)=>c===5&&r[5]==='NEW'?'bad':c===1&&/LOCK|TAMPER/.test(r[1])?'bad':''});
  on('[data-act=aread]',async()=>{secS.alerts.forEach(a=>a.read=true);await saveSec();render();});
  on('[data-act=aclr]',async()=>{if(!await askPw('Clear alerts'))return;secS.alerts=[];await saveSec();await log('ALERTS CLEARED','');render();});
  on('[data-act=unl]',async k=>{delete secS.locked[k];secS.fails[k]=0;await saveSec();await log('UNLOCK',k);toast(k+' unlocked');render();});
  on('[data-act=rel]',async k=>{const u=users.find(x=>x.msid.toLowerCase()===k);if(!u)return;u.pc='';await saveUsers('release pc');await rm('Sessions/'+k+'.rpx');await log('RELEASE PC',k);toast(k+' PC released');render();});
  on('[data-act=rsave]',async()=>{cfg.roster=$$('[data-rn]').filter(c=>c.checked).map(c=>c.dataset.rn);cfg.rosterOn=$('#ro_on').checked;await saveCfg('team list');await log('TEAM LIST',cfg.roster.length+' names');toast('Team list saved');render();});
  on('[data-act=radd]',async()=>{const v=normN($('#ro_new').value);if(!v)return;cfg.roster=[...(cfg.roster||[]),v];await saveCfg('team list');render();});
  on('[data-act=asave]',async()=>{cfg.announce=$('#ann_t').value.trim();await saveCfg('announcement');toast('Announcement published');render();});
  on('[data-act=aclr]',async()=>{cfg.announce='';await saveCfg('announcement');toast('Announcement cleared');render();});
  on('[data-act=kick]',async k=>{await rm('Sessions/'+k+'.rpx');await log('KICK',k);toast(k+' session closed (signed out within 1 min)');render();});
  // settings
  on('[data-act=ss]',async()=>{const g=id=>$('#'+id).value;cfg.target=+g('s_t')||344;cfg.th={utilBad:+g('s_ub'),effBad:+g('s_eb'),effWarn:+g('s_ew')};
    Object.assign(cfg.mail,{to:g('s_to'),cc:g('s_cc'),subject:g('s_sub'),adminEmail:g('s_ae').trim(),webhook:g('s_wh').trim()});cfg.expiry=g('s_ex')||cfg.expiry;cfg.keep={logs:+g('s_kl')||30,backups:+g('s_kb')||30};
    await saveCfg('settings');await log('SETTINGS','saved');toast('Settings saved');render();});
  // security
  $$('[data-sec]').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'));
  on('[data-act=sec]',async()=>{$$('[data-sec]').forEach(b=>cfg.sec[b.dataset.sec]=b.getAttribute('aria-pressed')==='true');cfg.sec.maxFails=Math.max(1,+$('#s_mf').value||5);cfg.sec.autoLogout=+$('#s_al').value||0;
    await saveCfg('security');await log('SECURITY',JSON.stringify(cfg.sec));armIdle();toast('Security saved');render();});
  on('[data-act=mpc]',async()=>{const a=users.find(u=>u.msid.toLowerCase()===ADMIN_MSID);if(await sha($('#s_op').value)!==a.pw)return toast('Current password is incorrect');const np=$('#s_np').value;if(np.length<6)return toast('New password must be at least 6 characters');
    a.pw=await sha(np);await saveUsers('admin password');if(localStorage.getItem('rp23_pw_'+ADMIN_MSID))localStorage.setItem('rp23_pw_'+ADMIN_MSID,btoa(unescape(encodeURIComponent(np))));await log('ADMIN PASSWORD CHANGED','');toast('Master password changed');render();});
  // logs
  if(adTab==='logs'){new Sheet($('#lsh'),{ro:true,left:[5],w:{5:420},headers:['Date','Time','MSID','PC','Action','Detail'],data:window._logs.map(l=>[l.d||'',l.t,l.msid,l.pc,l.action,l.detail]),cls:(r,c)=>c===4&&/FAIL|LOCK|DELETE|KICK|TAMPER/.test(r[4])?'bad':c===4&&/SAVE|LOGIN/.test(r[4])?'good':''});
    $('#lp').onchange=e=>{window._lp=e.target.value;render();};
    on('[data-act=le1]',async()=>{if(!await askPw('Erase log '+window._lp))return;await rm('Logs/'+window._lp);window._lp='all';await log('LOG ERASED','1 day');render();});
    on('[data-act=leall]',async()=>{if(!await askPw('Erase ALL logs'))return;for(const f of await ls('Logs'))await rm('Logs/'+f);window._lp='all';await log('LOG ERASED','all');render();});}
  // backups
  on('[data-act=ddel]',async()=>{const d=$('#ddel').value;if(!d||!confirm(fmtD(d)+' will be deleted for everyone.'))return;if(!await askPw('Delete '+fmtD(d)))return;await backup('before delete '+d);await rm(dataP(d));delete cache[d];await log('DELETE DATE',d);if(d===cur.date)await loadWork(d);toast('Deleted '+fmtD(d));render();});
  on('[data-act=bn]',async()=>{await backup('manual');toast('Backup created');render();});
  on('[data-act=br]',async a=>{const [f,i]=a.split('|');const b=await rd('Backups/'+f,null),s=b&&b.snaps[+i];if(!s)return;if(!await askPw('Restore backup '+f.slice(7,17)+' '+s.t))return;
    await backup('before restore');cfg=Object.assign(DEF_CFG(),s.cfg);users=s.users;await saveCfg('restored');await saveUsers('restored');for(const d in (s.data||{})){await wr(dataP(d),s.data[d]);cache[d]=s.data[d];}
    tamper.clear();usersBroken=false;me=users.find(u=>u.msid.toLowerCase()===ADMIN_MSID)||me;await log('RESTORE',f+' #'+i);toast('Restore complete');render();});
}
function userModal(i){const nu=i<0;const u=nu?{msid:'',empId:'',name:'',email:'',team:'',pc:'',role:'Employee',pw:'',validTill:cfg.expiry,active:true,perms:NEWPERMS()}:JSON.parse(JSON.stringify(users[i]));const a=u.msid.toLowerCase()===ADMIN_MSID;
  const fl=(id,l,v,x='')=>`<div class="fld"><label for="${id}">${l}</label><input class="in" id="${id}" value="${esc(v)}" ${x}></div>`;
  const ov=modal(`<div class="tools" style="justify-content:space-between;margin-bottom:12px"><h3 style="margin:0;font-size:19px">${nu?'Add user':'Edit · '+esc(u.name)}</h3>${B('',{i:'x',act:'mx',t:'Close'})}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px">${fl('u_n','Full name',u.name)}${fl('u_m','MSID',u.msid,a?'disabled':'')}${fl('u_e','Employee ID',u.empId||'',a?'disabled':'')}${fl('u_em','Email',u.email||'')}${fl('u_t','Team / process',u.team||'')}
   ${a?'':fl('u_pc','PC name (blank = set by user at first sign-in)',u.pc)}${a?'':`<div class="fld"><label for="u_r">Role</label><select class="in" id="u_r">${['Employee','Lead','Manager','SME'].map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>`}${fl('u_v','Valid till',u.validTill,'type="date" '+(a?'disabled':''))}</div>
   ${a?'':`<div class="cap" style="margin-top:14px">Access</div><div class="perm">${PERMS.map(p=>`<label><input type="checkbox" data-up="${p[0]}" ${u.perms[p[0]]?'checked':''}>${p[1]}</label>`).join('')}</div>
   <div class="line" style="margin-top:10px"><span><b>Active</b><div class="sub">Off = sign-in disabled</div></span><button type="button" class="tg" id="u_a" aria-pressed="${u.active}" aria-label="Active"></button></div>`}
   <div class="sub" style="margin-top:8px">${nu?'The user sets their own PC name and password at first sign-in.':''}</div>
   <div class="tools" style="margin-top:14px">${B('Save',{k:'pri',i:'save',act:'us'})}${!nu&&!a?B('Fresh start (reset PC + password)',{i:'history',act:'ur'})+B('Delete',{k:'dan',i:'trash',act:'ud'}):''}</div>`);
  const q=s=>$(s,ov);$('[data-act=mx]',ov).onclick=()=>ov.remove();const ta=q('#u_a');if(ta)ta.onclick=()=>ta.setAttribute('aria-pressed',ta.getAttribute('aria-pressed')!=='true');
  $('[data-act=us]',ov).onclick=async()=>{const m=a?u.msid:q('#u_m').value.trim();if(!m||!q('#u_n').value.trim())return toast('Name and MSID are required');
    if(users.some((x,j)=>j!==i&&x.msid.toLowerCase()===m.toLowerCase()))return toast('This MSID already exists');if(!a&&m.toLowerCase()===ADMIN_MSID)return toast('This is the Admin ID');
    Object.assign(u,{name:q('#u_n').value.trim(),msid:m,email:q('#u_em').value.trim(),team:q('#u_t').value.trim()});
    if(!a){Object.assign(u,{empId:q('#u_e').value.trim(),pc:q('#u_pc').value.trim(),role:q('#u_r').value,validTill:q('#u_v').value||cfg.expiry,active:ta.getAttribute('aria-pressed')==='true'});$$('[data-up]',ov).forEach(c=>u.perms[c.dataset.up]=c.checked);if(u.role==='SME')users.forEach(x=>{if(x!==users[i]&&x.msid!==u.msid&&x.role==='SME'){x.role='Lead';toast(x.name+' is no longer SME (only one SME allowed)');}});}
    if(nu){u.created=new Date().toISOString();users.push(u);}else users[i]=u;if(a)me=Object.assign(u,{pcNow:me.pcNow,sid:me.sid});
    await saveUsers('user '+u.msid);await log(nu?'USER ADD':'USER EDIT',u.msid);ov.remove();toast('Saved: '+u.name);render();};
  const r=$('[data-act=ur]',ov);if(r)r.onclick=async()=>{users[i].pc='';users[i].pw='';delete secS.locked[u.msid.toLowerCase()];await saveSec();await rm('Sessions/'+u.msid.toLowerCase()+'.rpx');await saveUsers('reset '+u.msid);await log('FRESH START',u.msid);ov.remove();toast(u.name+': new PC + password at next sign-in');render();};
  const d=$('[data-act=ud]',ov);if(d)d.onclick=async()=>{if(!confirm(u.name+' — delete this user?'))return;users.splice(i,1);await rm('Sessions/'+u.msid.toLowerCase()+'.rpx');await saveUsers('delete '+u.msid);await log('USER DELETE',u.msid);ov.remove();render();};}
function importUsers(){const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.txt';
  inp.onchange=async()=>{const t=await inp.files[0].text(),L=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(L.length<2)return toast('CSV is empty');const sp=L[0].includes('\t')?'\t':',';const H=L[0].split(sp).map(h=>h.trim().toLowerCase());const ix=n=>H.findIndex(h=>h.includes(n));
    let ad=0,up=0;for(const l of L.slice(1)){const c=l.split(sp).map(x=>x.trim().replace(/^"|"$/g,''));const m=c[ix('msid')];if(!m||m.toLowerCase()===ADMIN_MSID)continue;let u=users.find(x=>x.msid.toLowerCase()===m.toLowerCase());
      if(!u){u={msid:m,empId:'',name:m,email:'',team:'',pc:'',role:'Employee',pw:'',validTill:cfg.expiry,active:true,perms:NEWPERMS(),created:new Date().toISOString()};users.push(u);ad++;}else up++;
      const g=n=>ix(n)>=0?c[ix(n)]:'';if(g('name'))u.name=g('name');if(g('employee'))u.empId=g('employee');if(g('email'))u.email=g('email');if(g('team'))u.team=g('team');if(g('pc'))u.pc=g('pc');if(g('valid'))u.validTill=anyDate(g('valid'))||u.validTill;if(/lead/i.test(g('role')))u.role='Lead';}
    await saveUsers('import');await log('USERS IMPORT',`${ad} new, ${up} updated`);toast(`${ad} added · ${up} updated`);render();};inp.click();}

/* ---------------- boot ---------------- */
window.addEventListener('beforeunload',e=>{if(me&&cur.dirty){e.preventDefault();e.returnValue='';}});
(async()=>{range={from:monday(iso()),to:iso()};cur.date=iso();
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist();const L=await idbGet('login');if(L){if(!localStorage.getItem('rp23_pc')&&L.pc)localStorage.setItem('rp23_pc',L.pc);if(!localStorage.getItem('rp23_msid')&&L.msid){localStorage.setItem('rp23_msid',L.msid);if(L.pw)localStorage.setItem('rp23_pw_'+L.msid.toLowerCase(),L.pw);}}rootH=await idbGet('root')||null;}catch(e){}
  try{const h=await idbGet('dir');if(h){savedH=h;if((await h.queryPermission({mode:'readwrite'}))==='granted'){dir=h;await loadStore();}}}catch(e){}render();})();
</script>
