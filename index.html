<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alpha NextGen Eclipse — Repricing V23.0.7</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Orbitron:wght@600;700&display=swap">
<style>
:root{
  --bg:#fff8ef;--surf:#ffffff;--surf2:#fff1e0;--bd:#f1d8bb;--tx:#2b1a0e;--mu:#6b4a33;
  --ac:#c2410c;--ac-d:#8a2d07;--ac2:#9d174d;--acsoft:#ffedd5;--r:22px;
  --good-b:#dcfce7;--good-f:#14532d;--warn-b:#ffedd5;--warn-f:#9a3412;--bad-b:#fce7f3;--bad-f:#9d174d;
  --press:#86efac;--press-glow:rgba(74,222,128,.55);
  --sh:0 12px 28px rgba(194,65,12,.10);
  --font:'Plus Jakarta Sans',system-ui,'Segoe UI',sans-serif;--digi:'Orbitron','Plus Jakarta Sans',sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:var(--font);font-size:14px}
body.nosel *:not(input):not(textarea):not([contenteditable="true"]){user-select:none}
a{color:var(--ac)}
button,input,select,textarea{font-family:inherit;font-size:14px;color:var(--tx)}
.hidden{display:none!important}

/* ---------- DIGITAL 3D BUTTONS ---------- */
.b3{--top:#ffffff;--side:#e9cfae;--txc:var(--tx);
  position:relative;display:inline-flex;align-items:center;justify-content:center;gap:8px;
  padding:10px 16px;min-height:42px;border-radius:14px;border:1px solid var(--side);cursor:pointer;
  background:linear-gradient(180deg,var(--top) 0%,var(--top) 55%,rgba(0,0,0,.03) 100%);color:var(--txc);
  font-weight:700;letter-spacing:.01em;white-space:nowrap;
  box-shadow:0 5px 0 var(--side),0 9px 16px rgba(120,53,15,.16),inset 0 1px 0 rgba(255,255,255,.9);
  transform:translateY(0);transition:transform .08s,box-shadow .08s,background .15s}
.b3:hover{filter:brightness(1.03)}
.b3:active,.b3.on,.b3[aria-pressed="true"]{transform:translateY(4px);
  box-shadow:0 1px 0 var(--side),0 3px 0 var(--press),0 6px 14px var(--press-glow),inset 0 2px 5px rgba(0,0,0,.18)}
.b3:disabled{opacity:.45;cursor:not-allowed;transform:none}
.b3.pri{--top:#ea580c;--side:#8a2d07;--txc:#fff;background:linear-gradient(180deg,#f97316 0%,#c2410c 100%);border-color:#9a3412}
.b3.mag{--top:#be185d;--side:#6b0f35;--txc:#fff;background:linear-gradient(180deg,#db2777 0%,#9d174d 100%);border-color:#831843}
.b3.dan{--top:#fce7f3;--side:#f0abcf;--txc:#9d174d}
.b3.sm{padding:6px 11px;min-height:34px;font-size:12.5px;border-radius:11px;box-shadow:0 3px 0 var(--side),0 6px 10px rgba(120,53,15,.12),inset 0 1px 0 rgba(255,255,255,.9)}
.b3.sm:active,.b3.sm.on{transform:translateY(3px);box-shadow:0 0 0 var(--side),0 2px 0 var(--press),0 4px 10px var(--press-glow),inset 0 2px 4px rgba(0,0,0,.18)}
.b3.ico{padding:0;width:42px;min-width:42px}
.b3 svg{flex:0 0 auto}

/* toggle (3D) */
.tg{width:56px;height:30px;border-radius:999px;border:1px solid #e9cfae;background:#f3e3cf;position:relative;cursor:pointer;flex:0 0 auto;
  box-shadow:inset 0 2px 5px rgba(0,0,0,.15)}
.tg::after{content:"";position:absolute;top:2px;left:3px;width:24px;height:24px;border-radius:50%;background:linear-gradient(180deg,#fff,#f1e4d4);box-shadow:0 3px 0 #d6b48f,0 4px 8px rgba(0,0,0,.18);transition:left .15s}
.tg[aria-pressed="true"]{background:#bbf7d0;border-color:#4ade80;box-shadow:inset 0 2px 5px rgba(0,0,0,.12),0 0 10px var(--press-glow)}
.tg[aria-pressed="true"]::after{left:28px;box-shadow:0 1px 0 #16a34a,0 2px 6px rgba(0,0,0,.15)}

/* ---------- LAYOUT ---------- */
header.top{padding:16px 28px 0;display:flex;flex-direction:column;gap:14px;align-items:center}
.toprow{width:100%;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
.brand{display:flex;align-items:center;gap:12px}
.brand .t1{font-weight:800;font-size:17px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.brand .t2{font-size:12.5px;color:var(--mu);font-weight:600}
.ver{font-family:var(--digi);font-size:11px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--ac2);color:#fff;letter-spacing:.06em}
.nav{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:10px 12px 14px;background:var(--surf);border:1px solid var(--bd);border-radius:999px;box-shadow:var(--sh)}
.nav .b3{border-radius:999px;font-size:13px;padding:8px 14px;min-height:38px}
main{padding:24px 28px;max-width:1440px;margin:0 auto;width:100%}
footer{padding:16px;text-align:center;font-size:12px;color:var(--mu)}
.ph{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;justify-content:space-between;margin-bottom:18px}
.ph h1{margin:0;font-size:26px;font-weight:800}
.ph p{margin:4px 0 0;color:var(--mu)}
.row{display:flex;flex-wrap:wrap;gap:18px}
.grow{flex:999 1 600px;min-width:0}.side{flex:1 1 300px;min-width:0}
.card{background:var(--surf);border:1px solid var(--bd);border-radius:var(--r);box-shadow:var(--sh);padding:20px;min-width:0}
.card h3{margin:0;font-size:16px;font-weight:800}.card .sub{font-size:12.5px;color:var(--mu);margin-top:2px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:18px;margin-bottom:18px}
.kpi .ic{width:42px;height:42px;border-radius:12px;background:var(--acsoft);color:var(--ac);display:flex;align-items:center;justify-content:center}
.kpi .v{font-family:var(--digi);font-size:28px;font-weight:700;margin-top:12px;color:var(--tx)}
.kpi .l{font-size:13px;color:var(--mu);font-weight:600}.kpi .s{font-size:12.5px;color:var(--mu);margin-top:4px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;font-size:12px;font-weight:700;white-space:nowrap;background:var(--surf2);color:var(--mu)}
.chip.good{background:var(--good-b);color:var(--good-f)}.chip.warn{background:var(--warn-b);color:var(--warn-f)}.chip.bad{background:var(--bad-b);color:var(--bad-f)}.chip.soft{background:var(--acsoft);color:var(--ac)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor}
.tools{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:14px;align-items:center}
.line{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-top:1px solid var(--bd)}
.fld{display:flex;flex-direction:column;gap:6px}
.fld label{font-size:13px;font-weight:700}
.inp{display:flex;align-items:center;gap:10px;background:#fffaf4;border:1px solid var(--bd);border-radius:14px;padding:0 14px;min-height:46px;box-shadow:inset 0 2px 4px rgba(120,53,15,.06)}
.inp input,.inp select{flex:1;min-width:0;border:0;outline:0;background:transparent;height:44px}
.inp:focus-within{border-color:var(--ac);box-shadow:0 0 0 3px rgba(234,88,12,.15)}
input.plain,select.plain{border:1px solid var(--bd);border-radius:10px;padding:8px 10px;background:#fffaf4;min-height:38px}
.msg{padding:10px 14px;border-radius:14px;font-size:13px;font-weight:600;display:flex;gap:8px;align-items:center}
.msg.bad{background:var(--bad-b);color:var(--bad-f)}.msg.good{background:var(--good-b);color:var(--good-f)}.msg.warn{background:var(--warn-b);color:var(--warn-f)}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--bd);border-radius:14px}
table.t{width:100%;border-collapse:collapse}
table.t th{background:var(--acsoft);color:#7c2d12;font-size:12px;font-weight:800;text-align:left;padding:10px 12px;white-space:nowrap}
table.t td{padding:9px 12px;border-top:1px solid var(--bd);font-size:13.5px}
table.t td.n,table.t th.n{text-align:right}table.t td.c,table.t th.c{text-align:center}
.cell{display:inline-block;min-width:78px;text-align:center;padding:4px 8px;border-radius:8px;font-weight:800;font-size:13px}
.cell.good{background:var(--good-b);color:var(--good-f)}.cell.warn{background:var(--warn-b);color:var(--warn-f)}.cell.bad{background:var(--bad-b);color:var(--bad-f)}

/* excel grid */
.xl{overflow:auto;max-height:560px;border:1px solid var(--bd);border-radius:14px;background:#fffaf4}
table.g{border-collapse:collapse;min-width:100%}
table.g td,table.g th{border:1px solid var(--bd);padding:7px 10px;font-size:13px;white-space:nowrap;min-width:90px;height:34px}
table.g th.ltr{background:var(--surf2);color:var(--mu);font-size:11px;font-weight:600;height:24px;padding:2px;position:sticky;top:0;z-index:2}
table.g td.rn{background:var(--surf2);color:var(--mu);font-size:11px;text-align:center;min-width:40px;width:40px}
table.g td.hd{background:var(--acsoft);color:#7c2d12;font-weight:800;position:sticky;top:24px;z-index:1}
table.g td[contenteditable="true"]:focus{outline:2px solid var(--ac);outline-offset:-2px;background:#fff}
.fbar{display:flex;gap:10px;align-items:center;margin-bottom:10px;flex-wrap:wrap}
.fbar .ref{font-family:monospace;padding:7px 12px;border-radius:8px;background:var(--surf2);border:1px solid var(--bd);min-width:56px;text-align:center}
.fbar .val{flex:1;min-width:200px;padding:7px 12px;border-radius:8px;background:#fff;border:1px solid var(--bd);min-height:34px}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.cal .wd{text-align:center;font-size:12px;font-weight:800;color:var(--mu);text-transform:uppercase;padding:4px}
.cal .d{display:flex;flex-direction:column;justify-content:space-between;align-items:flex-start;min-height:76px;padding:10px;border-radius:14px;border:1px solid var(--bd);background:#fff;cursor:pointer;text-align:left;box-shadow:0 3px 0 #ecd2b2}
.cal .d:active,.cal .d.sel{transform:translateY(3px);box-shadow:0 0 0 #ecd2b2,0 2px 0 var(--press),0 4px 10px var(--press-glow)}
.cal .d b{font-size:16px}.cal .d span{font-size:11px;font-weight:700}
.cal .d.good{background:var(--good-b);color:var(--good-f)}.cal .d.bad{background:var(--bad-b);color:var(--bad-f)}.cal .d.we{background:transparent;color:var(--mu);box-shadow:none}
.cal .d.today{outline:2px solid var(--ac)}.cal .d.pick{outline:3px dashed var(--ac2)}

/* login */
.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:32px}
.lbox{width:100%;max-width:900px;display:flex;flex-wrap:wrap;background:#fff;border-radius:36px;box-shadow:0 30px 70px rgba(194,65,12,.15);overflow:hidden}
.lleft{flex:1 1 320px;background:var(--surf2);padding:44px;text-align:center;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:6px}
.sun{width:120px;height:120px;border-radius:50%;margin-bottom:14px;background:radial-gradient(circle at 40% 35%,#fdba74,#ea580c 60%,#9d174d);display:flex;align-items:center;justify-content:center;box-shadow:0 18px 40px rgba(234,88,12,.35)}
.lright{flex:1 1 380px;padding:40px;display:flex;flex-direction:column;gap:14px}
.lright h2{margin:0;font-size:26px;font-weight:800}

/* modal + toast */
.ov{position:fixed;inset:0;background:rgba(43,26,14,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:50}
.modal{background:#fff;border-radius:26px;max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:24px;box-shadow:0 30px 80px rgba(0,0,0,.3)}
.toast{position:fixed;right:20px;bottom:20px;z-index:60;display:flex;flex-direction:column;gap:8px}
.toast div{background:#2b1a0e;color:#fff;padding:12px 16px;border-radius:14px;font-weight:600;box-shadow:0 10px 24px rgba(0,0,0,.25);max-width:360px}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.perm{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.perm label{display:flex;gap:8px;align-items:center;padding:8px 10px;border:1px solid var(--bd);border-radius:12px;font-size:13px;font-weight:600}
.perm input{width:18px;height:18px;accent-color:#16a34a}
.mailbox{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;font-family:Calibri,Arial,sans-serif;color:#000}
.ring{width:96px;height:96px;border-radius:50%;display:flex;align-items:center;justify-content:center}
.ring>div{width:74px;height:74px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-family:var(--digi);font-weight:700;font-size:15px}
@media (max-width:700px){main{padding:16px}header.top{padding:12px 14px 0}.lright,.lleft{padding:26px}}
</style>

/* ---------------- utils ---------------- */
function todayISO(d=new Date()){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate());}
function parseISO(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d);}
function fmtD(s){const d=parseISO(s);return d.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'});}
function usD(s){const d=parseISO(s);return (d.getMonth()+1)+'/'+d.getDate()+'/'+d.getFullYear();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function num(v){if(v==null)return NaN;const s=String(v).replace(/[,%\s]/g,'');if(s==='')return NaN;return Number(s);}
function pct(v){const raw=String(v??'');let n=num(v);if(isNaN(n))return NaN;if(!raw.includes('%')&&Math.abs(n)<=3)n*=100;return n;}
function f2(n){return isNaN(n)?'':n.toFixed(2);}
function mins(txt){let t=0;String(txt||'').replace(/(\d+(?:\.\d+)?)\s*(?:mins?|minutes?|m)\b/gi,(_,n)=>{t+=Number(n);});return t;}
function hm(minsLeft){const h=Math.floor(minsLeft/60),m=Math.round(minsLeft%60);return h+'.'+String(m).padStart(2,'0');}
function toast(t){const el=document.createElement('div');el.textContent=t;$('#toast').appendChild(el);setTimeout(()=>el.remove(),3600);}
function $(s,r=document){return r.querySelector(s);} function $$(s,r=document){return [...r.querySelectorAll(s)];}
function can(p){if(!me)return false;const adm=me.role==='Admin'&&String(me.msid).toLowerCase()===ADMIN_MSID&&!me.viewAs;if(p==='admin')return adm;return adm||!!(me.perms&&me.perms[p]);}
function daysAgo(iso){return Math.floor((parseISO(todayISO())-parseISO(iso))/864e5);}
async function sha(s){
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('rp23|'+s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('');}
  catch(e){let h=5381;for(const c of 'rp23|'+s)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+(h>>>0).toString(16);}
}
function weekMonday(iso){const d=parseISO(iso);const wd=(d.getDay()+6)%7;d.setDate(d.getDate()-wd);return d;}
function weekDays(iso){const m=weekMonday(iso);return [...Array(7)].map((_,i)=>{const d=new Date(m);d.setDate(m.getDate()+i);return todayISO(d);});}
function weekNo(iso){return Math.ceil(weekMonday(iso).getDate()/7);}

 server:'<rect x="4" y="3" width="16" height="7" rx="2"/><rect x="4" y="14" width="16" height="7" rx="2"/><path d="M8 6.5h.01M8 17.5h.01"/>',
 shield:'<path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"/><path d="M9 12l2 2 4-4"/>',users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.5 3.4-5 6.5-5s5.7 1.5 6.5 5"/><circle cx="17" cy="9" r="2.5"/>',

 edit:'<path d="M4 20h4L19 9l-4-4L4 16z"/>',trash:'<path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/>',save:'<path d="M5 3h11l3 3v15H5z"/><path d="M8 3v6h8V3M8 21v-7h8v7"/>',
 check:'<path d="M5 12l5 5 9-10"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',download:'<path d="M12 4v12M7 11l5 5 5-5M4 18v2h16v-2"/>',upload:'<path d="M12 16V4M7 9l5-5 5 5M4 16v4h16v-4"/>',

/* ---------------- IndexedDB (keeps folder link) ---------------- */
function idb(){return new Promise((res,rej)=>{const r=indexedDB.open('rp23',1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error);});}
async function idbSet(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=()=>r();});}
async function idbGet(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>r(q.result);q.onerror=()=>r(null);});}

/* ---------------- storage: server folder, or this PC (local) when not connected ---------------- */
async function lget(k){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').get('F:'+k);q.onsuccess=()=>r(q.result??null);q.onerror=()=>r(null);});}
async function lset(k,v){const d=await idb();return new Promise(r=>{const t=d.transaction('kv','readwrite');const s=t.objectStore('kv');v===null?s.delete('F:'+k):s.put(v,'F:'+k);t.oncomplete=()=>r();});}
async function lkeys(){const d=await idb();return new Promise(r=>{const q=d.transaction('kv').objectStore('kv').getAllKeys();q.onsuccess=()=>r(q.result.filter(k=>String(k).startsWith('F:')).map(k=>k.slice(2)));q.onerror=()=>r([]);});}
async function dh(path,create=true){let h=dir;for(const p of path.split('/').filter(Boolean))h=await h.getDirectoryHandle(p,{create});return h;}
async function readText(path){if(!dir)return await lget(path);try{const parts=path.split('/');const f=parts.pop();const d=await dh(parts.join('/'),false);const fh=await d.getFileHandle(f);return await (await fh.getFile()).text();}catch(e){return null;}}
async function readJSON(path,def){const t=await readText(path);if(t==null)return def;try{return JSON.parse(t);}catch(e){return def;}}
async function writeFile(path,content){if(!dir)return lset(path,content);const parts=path.split('/');const f=parts.pop();const d=await dh(parts.join('/'),true);const fh=await d.getFileHandle(f,{create:true});const w=await fh.createWritable();await w.write(content);await w.close();}
const writeJSON=(p,o)=>writeFile(p,JSON.stringify(o,null,1));
async function listNames(path){if(!dir){const pre=path.replace(/\/$/,'')+'/';return (await lkeys()).filter(k=>k.startsWith(pre)&&!k.slice(pre.length).includes('/')).map(k=>k.slice(pre.length)).sort();}
  try{const d=await dh(path,true);const out=[];for await(const [n,h] of d.entries())if(h.kind==='file')out.push(n);return out.sort();}catch(e){return [];}}
async function delFile(path){if(!dir)return lset(path,null);const parts=path.split('/');const f=parts.pop();const d=await dh(parts.join('/'),false);await d.removeEntry(f);}
const storeName=()=>dir?('Server: '+dir.name):'Local: this PC';

async function pickFolder(){
  if(!window.showDirectoryPicker){toast('Ye browser folder connect support nahi karta. Chrome ya Edge mein kholo.');return;}
  try{const h=await window.showDirectoryPicker({id:'repricing23',mode:'readwrite'});await idbSet('dir',h);await useFolder(h);}catch(e){if(e.name!=='AbortError')toast('Connect failed: '+e.message);}
}
async function reconnect(){
  const h=await idbGet('dir');if(!h)return pickFolder();
  try{let p=await h.queryPermission({mode:'readwrite'});if(p!=='granted')p=await h.requestPermission({mode:'readwrite'});if(p==='granted')await useFolder(h);else toast('Permission nahi mili');}catch(e){pickFolder();}
}
async function useFolder(h){
  dir=h;const wasMe=me;await loadStore();
  if(wasMe&&!wasMe.guest){const u=users.find(x=>x.msid.toLowerCase()===wasMe.msid.toLowerCase());me=u&&u.active?u:null;}
  else me=null;
  await refreshSaved();await loadDate(cur.date);render();toast('Server folder connected: '+h.name);await log('SERVER CONNECT',h.name);
}
async function loadStore(){
  cfg=Object.assign(DEF_CFG(),await readJSON('Repricing_Config.json',{}));
  const d=DEF_CFG();for(const k of ['th','mail','sec','keep','headers','guest'])cfg[k]=Object.assign(d[k],cfg[k]||{});
  delete cfg.sec.adminPw;
  users=await readJSON('Repricing_Users.json',null);
  if(!users||!users.length)users=[DEF_ADMIN()];
  let a=users.find(u=>u.msid.toLowerCase()===ADMIN_MSID);if(!a){a=DEF_ADMIN();users.unshift(a);}
  users.forEach(u=>{if(u!==a&&u.role==='Admin')u.role='Lead';});a.role='Admin';a.active=true;a.perms=allPerms(true);a.empId=a.empId||ADMIN_EMP;if(!a.pw)a.pw=ADMIN_PW0;if(a.validTill<cfg.expiry)a.validTill=cfg.expiry;
  await writeJSON('Repricing_Config.json',cfg);await saveUsers(false);
  localStorage.setItem('rp23_sec',JSON.stringify(cfg.sec));

}
async function purgeOld(){
  for(const [folder,keep] of [['Logs',cfg.keep.logs],['Backups',cfg.keep.backups]]){
    for(const n of await listNames(folder)){const m=n.match(/(\d{4}-\d{2}-\d{2})/);if(m&&daysAgo(m[1])>keep){try{await delFile(folder+'/'+n);}catch(e){}}}
  }
}

async function log(action,detail=''){

  try{const arr=await readJSON(p,[]);arr.push({t:new Date().toLocaleTimeString('en-GB'),msid:me?me.msid:(detail.msid||'-'),pc:localStorage.getItem('rp23_pc')||'',action,detail:typeof detail==='string'?detail:JSON.stringify(detail)});await writeJSON(p,arr);}catch(e){}

async function backup(reason){
  if(!cfg)return;const day=todayISO(),p='Backups/Repricing_Backup_'+day+'.json';
  const b=await readJSON(p,{day,snapshots:[]});
  const data=await readJSON('Data/'+cur.date+'.json',null);
  b.snapshots.push({t:new Date().toLocaleTimeString('en-GB'),by:me?me.msid:'-',reason,cfg,users,data});
  if(b.snapshots.length>40)b.snapshots=b.snapshots.slice(-40);
  await writeJSON(p,b);
}

/* ---------------- Excel (SpreadsheetML) ---------------- */
function xlsXML(sheets){
  const x=s=>esc(s);
  let o='<?xml version="1.0"?>\n<?mso-application progid="Excel.Sheet"?>\n<Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
   '<Styles><Style ss:ID="h"><Font ss:Bold="1" ss:Color="#FFFFFF"/><Interior ss:Color="#16A34A" ss:Pattern="Solid"/></Style>'+
   '<Style ss:ID="g"><Interior ss:Color="#92D050" ss:Pattern="Solid"/></Style><Style ss:ID="o"><Interior ss:Color="#FFA500" ss:Pattern="Solid"/></Style><Style ss:ID="p"><Interior ss:Color="#FF99CC" ss:Pattern="Solid"/></Style></Styles>';
  const used=new Set();
  for(const s of sheets){let nm=String(s.name).replace(/[\\\/\?\*\[\]:]/g,'-').slice(0,31);while(used.has(nm))nm=nm.slice(0,28)+'_'+used.size;used.add(nm);
    o+=`<Worksheet ss:Name="${x(nm)}"><Table>`;
    s.rows.forEach((r,i)=>{o+='<Row>'+r.map((c,j)=>{const st=i===0?' ss:StyleID="h"':(s.styles&&s.styles[i]&&s.styles[i][j]?` ss:StyleID="${s.styles[i][j]}"`:'');const n=typeof c==='number'&&isFinite(c);return `<Cell${st}><Data ss:Type="${n?'Number':'String'}">${x(c)}</Data></Cell>`;}).join('')+'</Row>';});
    o+='</Table></Worksheet>';}
  return o+'</Workbook>';
}
function download(name,content,type='application/vnd.ms-excel'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([content],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),4000);}

function kindOf(v,type){const t=cfg?cfg.th:DEF_CFG().th;if(isNaN(v))return '';if(type==='util')return v<t.utilBad?'bad':'good';return v<t.effBad?'bad':(v>t.effWarn?'warn':'good');}

function repRowsOf(rows,date){return (rows||[]).filter(r=>r&&String(r[1]||'').trim()).map(r=>{const p=num(r[2]);const tg=cfg.target;return {date:String(r[0]||'').trim()||usD(date),name:String(r[1]).trim(),proc:isNaN(p)?0:p,ach:isNaN(p)?0:p,target:tg,def:tg-(isNaN(p)?0:p),comment:String(r[3]||''),mins:mins(r[3])};});}

/* ---------------- login ---------------- */
function cachedPw(msid){const s=localStorage.getItem('rp23_pw_'+String(msid).toLowerCase());if(!s)return '';try{return decodeURIComponent(escape(atob(s)));}catch(e){return '';}}
async function tryLogin(pc,msid,pw,remember,say){
  if(cfg.sec.requireServer&&!dir)return say('Pehle server folder connect karo — bina connect login nahi hoga.');
  pc=pc.trim();msid=msid.trim();
  if(!pc||!msid)return say('PC name aur MSID dono bharo.');
  const lockKey='rp23_lock_'+msid.toLowerCase(),lock=Number(localStorage.getItem(lockKey)||0);
  if(Date.now()<lock)return say('Bahut galat try ho gaye. '+Math.ceil((lock-Date.now())/60000)+' min baad try karo.');
  const u=users.find(x=>x.msid.toLowerCase()===msid.toLowerCase());
  const isAdm=!!u&&u.msid.toLowerCase()===ADMIN_MSID;
  if(!isAdm&&todayISO()>cfg.expiry)return say('Tool ki validity khatam ('+fmtD(cfg.expiry)+'). Admin se contact karo.');
  const fail=async(t)=>{const fk='rp23_fail_'+msid.toLowerCase();const n=Number(localStorage.getItem(fk)||0)+1;localStorage.setItem(fk,n);
    await log('LOGIN FAILED',{msid,pc,reason:t});if(n>=cfg.sec.maxFails){localStorage.setItem(lockKey,Date.now()+5*60000);localStorage.setItem(fk,0);await log('LOCKED 5 MIN',{msid,pc});}
    say(t+(n<cfg.sec.maxFails?` (${cfg.sec.maxFails-n} try baaki)`:' — 5 min lock'));};
  if(!u)return fail('Ye MSID access list mein nahi hai.');
  if(isAdm){
    if(!isAdminPC(pc))return fail('Admin sirf apne PC se login ho sakta hai.');
    if(await sha(pw)!==u.pw)return fail('Master password galat hai.');
  }else{
    if(!u.active)return fail('Access band hai. Admin se baat karo.');
    if(u.validTill&&todayISO()>u.validTill)return fail('Aapka access '+fmtD(u.validTill)+' ko khatam ho gaya.');
    if(u.pc&&cfg.sec.onePC&&u.pc.toLowerCase()!==pc.toLowerCase())return fail('Ye MSID dusre PC se locked hai.');
    if(!u.pw){if(pw.length<4)return say('Pehli baar login: naya password banao (kam se kam 4 letters).','warn');u.pw=await sha(pw);if(cfg.sec.pwPlainInExcel)u.pwPlain=pw;}
    else if(await sha(pw)!==u.pw)return fail('Password galat hai.');
  }
  let bound=false;if(!isAdm&&!u.pc){u.pc=pc;bound=true;}
  u.lastLogin=new Date().toISOString();await saveUsers(false);
  localStorage.setItem('rp23_pc',pc);localStorage.setItem('rp23_msid',msid);localStorage.removeItem('rp23_fail_'+msid.toLowerCase());
  const keepPw=remember&&(isAdm?isAdminPC(pc):cfg.sec.rememberPw);
  if(keepPw)localStorage.setItem('rp23_pw_'+msid.toLowerCase(),btoa(unescape(encodeURIComponent(pw))));else localStorage.removeItem('rp23_pw_'+msid.toLowerCase());
  if(isAdm)localStorage.setItem('rp23_adminpc','1');
  me=Object.assign(u,{pcNow:pc});await log(isAdm?'ADMIN LOGIN':'LOGIN',bound?'PC bound: '+pc:pc);
  await refreshSaved();armIdle();toast('Welcome, '+u.name);return true;
}

function pasteText(txt,r0,c0,replace=false){
  let lines=String(txt).replace(/\r/g,'').split('\n');while(lines.length&&!lines[lines.length-1].trim())lines.pop();
  let grid=lines.map(l=>l.split('\t'));
  const hdr=cfg.headers[gridKind].map(h=>h.toLowerCase().replace(/\s/g,''));
  if(grid.length&&grid[0].some(x=>/name|date|volume|processed/i.test(x))&&grid[0].some(x=>hdr.includes(String(x).toLowerCase().replace(/\s/g,''))||/name/i.test(x)))grid.shift();
  const data=replace?(cur[gridKind]=[]):cur[gridKind];
  grid.forEach((row,i)=>{const r=r0+i;while(data.length<=r)data.push([]);row.forEach((v,j)=>{data[r][c0+j]=v.trim();});});
  const need=Math.max(...grid.map(r=>r.length+c0),0);while(cfg.headers[gridKind].length<need)cfg.headers[gridKind].push('Column '+(cfg.headers[gridKind].length+1));
  cur.dirty=true;toast(grid.length+' rows paste ho gaye');render();
}

/* ---------- EXPORT ---------- */
function dayRows(prod,rep,date){
  const P=(prod||[]).filter(r=>r&&String(r[0]||'').trim()).map(r=>({name:String(r[0]).trim(),vol:num(r[1]),util:pct(r[2]),eff:pct(r[3]),lc:pct(r[4]),ou:num(r[5])}));
  const st={good:'g',warn:'o',bad:'p'};
  const s1={name:'Summary '+date,rows:[['Name','Volume','Utilization','Efficiency','LC Efficiency','O/U'],...P.map(r=>[r.name,r.vol,f2(r.util)+'%',f2(r.eff)+'%',f2(r.lc)+'%',isNaN(r.ou)?'':r.ou])],styles:[[],...P.map(r=>[0,0,st[kindOf(r.util,'util')],st[kindOf(r.eff,'eff')],st[kindOf(r.lc,'eff')],0])]};
  const R=repRowsOf(rep,date);
  const s2={name:'Tracker '+date,rows:[['Date','Name','Processed- Reprice','Total/ Achieved','Daily Target','Deficit','Down Time Comments'],...R.map(r=>[r.date,r.name,r.proc,r.ach,r.target,r.def,r.comment])]};
  return [s1,s2];
}

  download(`Repricing_${cur.date}.xls`,xlsXML([a,b,c]));await log('EXPORT',cur.date);}
async function exportAll(){await refreshSaved();const sheets=[];for(const d of [...savedDates].sort()){const f=await readJSON('Data/'+d+'.json',null);if(!f)continue;const [a,b]=dayRows(f.prod,f.rep,d);

      ['rememberPw','Password PC pe yaad rakhne do','Login screen pe tick option'],['pwPlainInExcel','Users Excel mein password plain text','Off = sirf code (hash) dikhega · On = jo bhi folder khole wo padh sakta hai']];
    body=`<div class="card"><h3>Security switches</h3><div class="sub">Browser mein ye rok-tok hai, 100% lock nahi — asli suraksha server folder ki permission hai.</div>
     ${S.map(s=>`<div class="line"><div><b>${s[1]}</b><div class="sub">${s[2]}</div></div><button type="button" class="tg" aria-pressed="${!!cfg.sec[s[0]]}" data-sec="${s[0]}" aria-label="${s[1]}"></button></div>`).join('')}
     <div class="line"><div><b>Auto logout (minutes, 0 = off)</b></div><input class="plain" type="number" id="s_al" value="${cfg.sec.autoLogout}" style="width:90px" aria-label="Auto logout minutes"></div>
     <div class="line"><div><b>Galat try limit</b><div class="sub">Itne galat try ke baad 5 min lock + log</div></div><input class="plain" type="number" id="s_mf" value="${cfg.sec.maxFails}" style="width:90px" aria-label="Max fails"></div>
     <div style="margin-top:14px">${B('Save security',{k:'pri',icon:'save',act:'secsave'})}</div></div><div style="height:18px"></div>
     <div class="card"><h3>${ic('shield',18)} Admin protection</h3><div class="sub">Admin login = PC name …${ADMIN_PC_END.toUpperCase()} + MSID ${ADMIN_MSID} + master password · password sirf aapke PC pe cache hota hai</div>
     <div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:14px;align-items:flex-end"><div class="fld" style="flex:1 1 180px"><label for="s_op">Current master password</label><input class="plain" type="password" id="s_op"></div>
     <div class="fld" style="flex:1 1 180px"><label for="s_np">New master password</label><input class="plain" type="password" id="s_np"></div>${B('Change',{k:'mag',icon:'lock',act:'mpchg'})}</div></div>`;
  }
  if(adminTab==='logs'){
    const files=(await listNames('Logs')).reverse();const pick=window._logPick||files[0];const arr=pick?await readJSON('Logs/'+pick,[]):[];
    body=`<div class="card"><div class="tools" style="justify-content:space-between"><div><h3>History log</h3><div class="sub">${cfg.keep.logs} din tak · login, save, delete, export, admin changes</div></div>
     <select class="plain" id="logpick" aria-label="Log date">${files.map(f=>`<option ${f===pick?'selected':''}>${esc(f)}</option>`).join('')}</select></div>
     <div class="tw"><table class="t"><thead><tr><th>Time</th><th>MSID</th><th>PC</th><th>Action</th><th>Detail</th></tr></thead><tbody>${
     [...arr].reverse().map(l=>`<tr><td>${esc(l.t)}</td><td>${esc(l.msid)}</td><td>${esc(l.pc)}</td><td><span class="chip ${/FAIL|LOCK|DELETE/.test(l.action)?'bad':/SAVE|LOGIN$/.test(l.action)?'good':'soft'}">${esc(l.action)}</span></td><td style="font-size:12.5px">${esc(l.detail)}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mu)">Log khali hai.</td></tr>'}</tbody></table></div></div>`;
  }
  if(adminTab==='backups'){
    const files=(await listNames('Backups')).reverse();
    const det=[];for(const f of files){const b=await readJSON('Backups/'+f,{snapshots:[]});det.push([f,b.snapshots||[]]);}
    body=`<div class="card"><div class="tools" style="justify-content:space-between"><div><h3>Backups</h3><div class="sub">${cfg.keep.backups} din · har save/settings change pe snapshot (settings + users + us din ka data)</div></div>${B('Backup now',{k:'pri',icon:'save',act:'bnow',sm:1})}</div>
     <div class="tw"><table class="t"><thead><tr><th>Day</th><th>Time</th><th>By</th><th>Reason</th><th class="n">Restore</th></tr></thead><tbody>${
     det.flatMap(([f,s])=>s.map((x,i)=>[f,x,i]).reverse()).slice(0,120).map(([f,x,i])=>`<tr><td>${esc(f.match(/\d{4}-\d{2}-\d{2}/)[0])}</td><td>${esc(x.t)}</td><td>${esc(x.by)}</td><td>${esc(x.reason)}</td><td class="n">${B('Restore',{icon:'history',sm:1,act:'brest',arg:f+'|'+i})}</td></tr>`).join('')||'<tr><td colspan="5" style="color:var(--mu)">Abhi koi backup nahi.</td></tr>'}</tbody></table></div></div>`;
  }
  $('#main').innerHTML=head('Admin','Kisko kya access — sab yahin se · changes server pe save hote hain',`<span class="chip soft">${users.length} users</span>`)+`<div class="tabs">${T}</div>`+body;
  $$('[data-act="at"]').forEach(b=>b.onclick=()=>{adminTab=b.dataset.arg;render();});
  // users
  $$('[data-perm]').forEach(b=>b.onclick=async()=>{const [i,p]=b.dataset.perm.split('|');const u=users[+i];u.perms[p]=!u.perms[p];await saveUsers();await log('ACCESS',`${u.msid} ${p}=${u.perms[p]}`);render();});
  $$('[data-act="uedit"]').forEach(b=>b.onclick=()=>userModal(+b.dataset.arg));
  const ua=$('[data-act="uadd"]');if(ua)ua.onclick=()=>userModal(-1);
  const ux=$('[data-act="uxl"]');if(ux)ux.onclick=async()=>{await saveUsers(false);download('Repricing_Users.xls',await readText('Repricing_Users.xls'));};
  const ui=$('[data-act="uimp"]');if(ui)ui.onclick=importUsers;
  // settings
  const ss=$('[data-act="ssave"]');if(ss)ss.onclick=async()=>{cfg.target=Number($('#s_target').value)||344;cfg.th.utilBad=Number($('#s_utilBad').value);cfg.th.effBad=Number($('#s_effBad').value);cfg.th.effWarn=Number($('#s_effWarn').value);
    cfg.mail.to=$('#s_to').value;cfg.mail.cc=$('#s_cc').value;cfg.mail.subject=$('#s_sub').value;cfg.expiry=$('#s_exp').value||cfg.expiry;cfg.keep.logs=Number($('#s_kl').value)||30;cfg.keep.backups=Number($('#s_kb').value)||30;
    await saveCfg();await log('SETTINGS','rules/mail/validity');toast('Settings saved');render();};
  $$('[data-sec]').forEach(b=>b.onclick=()=>{b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true');});
  const sc=$('[data-act="secsave"]');if(sc)sc.onclick=async()=>{$$('[data-sec]').forEach(b=>cfg.sec[b.dataset.sec]=b.getAttribute('aria-pressed')==='true');cfg.sec.autoLogout=Number($('#s_al').value)||0;cfg.sec.maxFails=Math.max(1,Number($('#s_mf').value)||3);
    if(!cfg.sec.pwPlainInExcel)users.forEach(u=>u.pwPlain='');await saveCfg();await saveUsers(false);await log('SECURITY',JSON.stringify(cfg.sec));armIdle();toast('Security saved');render();};
  $$('[data-gperm]').forEach(b=>b.onclick=async()=>{const p=b.dataset.gperm;cfg.guest[p]=!cfg.guest[p];await saveCfg();await log('ACCESS','guest '+p+'='+cfg.guest[p]);render();});
  $$('[data-act="uas"]').forEach(b=>b.onclick=()=>startAs(users[+b.dataset.arg]));
  const mc=$('[data-act="mpchg"]');if(mc)mc.onclick=async()=>{const a=users.find(u=>u.msid.toLowerCase()===ADMIN_MSID);if(await sha($('#s_op').value)!==a.pw)return toast('Current password galat');
    const np=$('#s_np').value;if(np.length<4)return toast('Naya password kam se kam 4 letters');a.pw=await sha(np);a.pwPlain='';await saveUsers();
    if(isAdminPC(localStorage.getItem('rp23_pc'))&&localStorage.getItem('rp23_pw_'+ADMIN_MSID))localStorage.setItem('rp23_pw_'+ADMIN_MSID,btoa(unescape(encodeURIComponent(np))));
    await log('ADMIN PASSWORD CHANGED','');toast('Master password badal gaya');render();};
  const lp=$('#logpick');if(lp)lp.onchange=()=>{window._logPick=lp.value;render();};
  const bn=$('[data-act="bnow"]');if(bn)bn.onclick=async()=>{await backup('manual');toast('Backup ho gaya');render();};
  $$('[data-act="brest"]').forEach(b=>b.onclick=async()=>{const [f,i]=b.dataset.arg.split('|');const bk=await readJSON('Backups/'+f,null);const s=bk&&bk.snapshots[+i];if(!s)return;
    if(!confirm(`Backup (${s.t}, ${s.reason}) se settings + users${s.data?' + '+s.data.date+' ka data':''} wapas laayein?`))return;
    await backup('before restore');cfg=Object.assign(DEF_CFG(),s.cfg);users=s.users;await saveCfg();await saveUsers(false);if(s.data)await writeJSON('Data/'+s.data.date+'.json',s.data);
    me=users.find(u=>u.msid===me.msid)||me;await log('RESTORE',f+' #'+i);toast('Restore ho gaya');render();});
}
function userModal(i){
  const u=i>=0?JSON.parse(JSON.stringify(users[i])):{msid:'',name:'',pc:'',role:'Employee',pw:'',pwPlain:'',validTill:cfg.expiry,active:true,perms:Object.assign(allPerms(false),{paste:true,save:true,mail:true})};
  const ov=document.createElement('div');ov.className='ov';
  ov.innerHTML=`<div class="modal" role="dialog" aria-modal="true" aria-label="User"><div class="tools" style="justify-content:space-between"><h3 style="margin:0;font-size:20px">${i>=0?'Edit user':'Add user'}</h3>${B('',{icon:'x',act:'mx',title:'Close'})}</div>
   <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px">
   <div class="fld"><label for="u_name">Name</label><input class="plain" id="u_name" value="${esc(u.name)}"></div>
   <div class="fld"><label for="u_msid">MSID</label><input class="plain" id="u_msid" value="${esc(u.msid)}" ${u.msid===ADMIN_MSID?'disabled':''}></div>
   <div class="fld"><label for="u_emp">Employee ID</label><input class="plain" id="u_emp" value="${esc(u.empId||'')}" ${u.msid===ADMIN_MSID?'disabled':''}></div>
   ${u.msid===ADMIN_MSID?'':`<div class="fld"><label for="u_pc">PC name (khali = pehle login pe bind)</label><input class="plain" id="u_pc" value="${esc(u.pc)}"></div>`}
   <div class="fld"><label for="u_role">Role</label><select class="plain" id="u_role" ${u.msid===ADMIN_MSID?'disabled':''}>${(u.msid===ADMIN_MSID?['Admin']:['Employee','Lead']).map(r=>`<option ${u.role===r?'selected':''}>${r}</option>`).join('')}</select></div>
   ${u.msid===ADMIN_MSID?'':`<div class="fld"><label for="u_pw">Naya password (khali = same rahega)</label><input class="plain" id="u_pw" type="text" placeholder="${u.pw?'set hai':'pehle login pe user khud banayega'}"></div>`}
   <div class="fld"><label for="u_vt">Valid till</label><input class="plain" type="date" id="u_vt" value="${esc(u.validTill)}"></div></div>
   <div style="margin:16px 0 8px;font-weight:800">Access</div><div class="perm">${PERMS.filter(p=>p[0]!=='admin').map(p=>`<label><input type="checkbox" data-up="${p[0]}" ${u.perms[p[0]]?'checked':''}>${p[1]}</label>`).join('')}</div>
   <div class="line" style="margin-top:12px"><div><b>Active</b><div class="sub">Off = login band</div></div><button type="button" class="tg" id="u_act" aria-pressed="${u.active}" aria-label="Active"></button></div>
   <div class="tools" style="margin-top:16px">${B('Save',{k:'pri',icon:'save',act:'msave2'})}${i>=0&&u.msid!==ADMIN_MSID?B('Reset PC',{icon:'pc',act:'mpc'})+B('Reset password',{icon:'lock',act:'mpw'}):''}${i>=0&&u.msid!==ADMIN_MSID&&u.msid!==me.msid?B('Delete user',{k:'dan',icon:'trash',act:'mdel'}):''}</div></div>`;
  document.body.appendChild(ov);const close=()=>ov.remove();
  ov.querySelector('[data-act="mx"]').onclick=close;ov.onclick=e=>{if(e.target===ov)close();};
  ov.querySelector('#u_act').onclick=e=>e.currentTarget.setAttribute('aria-pressed',e.currentTarget.getAttribute('aria-pressed')!=='true');
  const q=s=>ov.querySelector(s);
  q('[data-act="msave2"]').onclick=async()=>{
    const msid=q('#u_msid').value.trim();if(!msid||!q('#u_name').value.trim())return toast('Name aur MSID chahiye');
    if(users.some((x,j)=>j!==i&&x.msid.toLowerCase()===msid.toLowerCase()))return toast('Ye MSID pehle se hai');
    const adm=u.msid===ADMIN_MSID;
    Object.assign(u,{name:q('#u_name').value.trim(),msid,empId:adm?ADMIN_EMP:q('#u_emp').value.trim(),pc:adm?'':q('#u_pc').value.trim(),role:u.msid===ADMIN_MSID?'Admin':q('#u_role').value,validTill:q('#u_vt').value||cfg.expiry,active:q('#u_act').getAttribute('aria-pressed')==='true'});
    ov.querySelectorAll('[data-up]').forEach(c=>u.perms[c.dataset.up]=c.checked);
    const np=adm?'':q('#u_pw').value;if(np){u.pw=await sha(np);u.pwPlain=cfg.sec.pwPlainInExcel?np:'';}if(adm){u.active=true;u.pwPlain='';}
    if(i>=0)users[i]=u;else users.push(u);if(me.msid===u.msid)me=Object.assign(u,{pcNow:me.pcNow});
    await saveUsers();await log(i>=0?'USER EDIT':'USER ADD',u.msid);close();toast('User saved');render();};
  const rp=q('[data-act="mpc"]');if(rp)rp.onclick=async()=>{users[i].pc='';await saveUsers();await log('RESET PC',u.msid);close();toast('PC reset — agle login pe naya PC bind hoga');render();};
  const rw=q('[data-act="mpw"]');if(rw)rw.onclick=async()=>{users[i].pw='';users[i].pwPlain='';await saveUsers();await log('RESET PASSWORD',u.msid);close();toast('Password reset — user agle login pe naya banayega');render();};
  const rd=q('[data-act="mdel"]');if(rd)rd.onclick=async()=>{if(!confirm(u.name+' ko hatayein?'))return;users.splice(i,1);await saveUsers();await log('USER DELETE',u.msid);close();render();};
}
function importUsers(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.csv,.txt';
  inp.onchange=async()=>{const t=await inp.files[0].text();const lines=t.replace(/\r/g,'').split('\n').filter(l=>l.trim());if(lines.length<2)return toast('CSV khali hai');
    const sep=lines[0].includes('\t')?'\t':',';const H=lines[0].split(sep).map(h=>h.trim().toLowerCase());const ix=n=>H.findIndex(h=>h.includes(n));
    let added=0,upd=0;for(const l of lines.slice(1)){const c=l.split(sep).map(x=>x.trim().replace(/^"|"$/g,''));const msid=c[ix('msid')];if(!msid)continue;
      let u=users.find(x=>x.msid.toLowerCase()===msid.toLowerCase());const isNew=!u;if(!u){u={msid,name:'',pc:'',role:'Employee',pw:'',pwPlain:'',validTill:cfg.expiry,active:true,perms:Object.assign(allPerms(false),{paste:true,save:true,mail:true})};users.push(u);}
      if(ix('name')>=0&&c[ix('name')])u.name=c[ix('name')];if(ix('employee')>=0&&c[ix('employee')]&&u.msid!==ADMIN_MSID)u.empId=c[ix('employee')];if(u.msid.toLowerCase()===ADMIN_MSID)continue;if(ix('pc')>=0&&c[ix('pc')])u.pc=c[ix('pc')];if(ix('role')>=0&&c[ix('role')]&&u.msid!==ADMIN_MSID)u.role=/lead/i.test(c[ix('role')])?'Lead':'Employee';
      if(ix('valid')>=0&&c[ix('valid')])u.validTill=c[ix('valid')];const pw=ix('password')>=0?c[ix('password')]:'';if(pw&&!pw.startsWith('#')){u.pw=await sha(pw);u.pwPlain=cfg.sec.pwPlainInExcel?pw:'';}
      isNew?added++:upd++;}
    await saveUsers();await log('USERS IMPORT',`${added} new, ${upd} updated`);toast(`${added} naye, ${upd} update`);render();};
  inp.click();
}

/* ---------------- boot ---------------- */
window.addEventListener('beforeunload',e=>{if(me&&cur.dirty){e.preventDefault();e.returnValue='';}});
(async()=>{render();await loadStore();await loadDate(todayISO());await refreshSaved();render();try{const h=await idbGet('dir');if(h&&(await h.queryPermission({mode:'readwrite'}))==='granted')await useFolder(h);}catch(e){}})();
</script>
